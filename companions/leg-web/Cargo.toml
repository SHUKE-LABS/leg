[package]
name = "leg-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Authenticated loopback Web host for leg companion sessions"

[lib]
name = "leg_web"

[[bin]]
name = "leg-web"
path = "src/main.rs"

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
fs2 = "0.4"
getrandom = "0.3"
leg-ui-client = { path = "../leg-ui-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3.15"
