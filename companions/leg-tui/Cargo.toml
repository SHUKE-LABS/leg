[package]
name = "leg-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Experimental terminal interface for leg"

[[bin]]
name = "leg-tui"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
leg-ui-client = { path = "../leg-ui-client" }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
