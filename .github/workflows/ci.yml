name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin' }}
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            companions/leg-web/tests/browser-requirements.txt
            companions/leg-tui/tests/requirements.txt

      - name: Cache Playwright Chromium
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ hashFiles('companions/leg-web/tests/browser-requirements.txt') }}

      - name: Test companion packages (locked)
        if: ${{ matrix.target != 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: cargo test --locked --manifest-path companions/Cargo.toml -p leg-ui-client -p leg-tui -p leg-web

      - name: Test Web host package on Windows (locked)
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: cargo test --locked --manifest-path companions/Cargo.toml -p leg-web

      - name: Build Web host on Windows (locked)
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: cargo build --locked --manifest-path companions/Cargo.toml -p leg-web --bin leg-web

      - name: Build Web lifecycle binaries (locked)
        if: ${{ matrix.target != 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: |
          cargo build --locked --bin leg
          cargo build --locked --manifest-path companions/Cargo.toml -p leg-ui-client --bin leg-ui-supervisor
          cargo build --locked --manifest-path companions/Cargo.toml -p leg-web --bin leg-web

      - name: Web host fake-provider lifecycle smoke
        if: ${{ matrix.target != 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: |
          python3 companions/leg-web/tests/lifecycle_smoke.py \
            companions/target/debug/leg-web \
            target/debug/leg \
            companions/target/debug/leg-ui-supervisor

      - name: Install Playwright Chromium
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          python3 -m pip install --requirement companions/leg-web/tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Web browser E2E with fake provider
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          python3 companions/leg-web/tests/browser_e2e.py \
            companions/target/debug/leg-web \
            target/debug/leg \
            companions/target/debug/leg-ui-supervisor

      - name: TUI Linux PTY smoke (locked)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          python3 -m pip install --requirement companions/leg-tui/tests/requirements.txt
          cargo build --locked --bin leg
          cargo build --locked --manifest-path companions/Cargo.toml -p leg-ui-client --bin leg-ui-supervisor
          cargo build --locked --manifest-path companions/Cargo.toml -p leg-tui
          python3 companions/leg-tui/tests/pty_smoke.py \
            --tui-bin companions/target/debug/leg-tui \
            --leg-bin target/debug/leg \
            --supervisor-bin companions/target/debug/leg-ui-supervisor

      - name: Build (locked)
        shell: bash
        run: cargo build --locked --verbose --target "${TARGET}"

      - name: Test (locked)
        shell: bash
        run: cargo test --locked --verbose --target "${TARGET}"

      - name: Test release helpers
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: bash tests/release_test.sh

      - name: Verify binary version
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          binary="target/${TARGET}/debug/leg"
          if [[ "${TARGET}" == *-windows-* ]]; then
            binary="${binary}.exe"
          fi
          test "$("./${binary}" --version)" = "leg ${version}"

  cross:
    runs-on: ubuntu-latest
    env:
      TARGET: armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: armv7-unknown-linux-musleabihf

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cross-build (locked)
        run: cross build --locked --verbose --target "${TARGET}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check companion formatting
        run: cargo fmt --manifest-path companions/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Web host Clippy
        run: cargo clippy --locked --manifest-path companions/Cargo.toml -p leg-web --all-targets -- -D warnings
