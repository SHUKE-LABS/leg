name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-trial-artifacts:
    # The report generator records the native/lint gates and prior bundle smoke as passed.
    # Keep this dependency and the smoke step in sync with that report.
    needs: [native, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-latest
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build experimental Web trial bundle
        run: bash scripts/build-web-trial.sh --output "${RUNNER_TEMP}/web-trial"

      - name: Unpack and smoke the experimental Web trial bundle
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find "${RUNNER_TEMP}/web-trial" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          [[ -n "${archive}" ]]
          unpack_dir="${RUNNER_TEMP}/web-trial-unpacked"
          mkdir -p "${unpack_dir}"
          tar -xzf "${archive}" -C "${unpack_dir}"
          bundle_dir="$(find "${unpack_dir}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          [[ -n "${bundle_dir}" ]]
          python_bin="$(command -v python3)"
          rustc_bin="$(command -v rustc)"
          runtime_path="/usr/bin:/bin:/usr/sbin:/sbin"
          PATH="${runtime_path}" "${python_bin}" \
            companions/leg-web/tests/trial_bundle_smoke.py --bundle-dir "${bundle_dir}"
          PATH="${runtime_path}" \
            LEG_TEST_RUSTC_BIN="${rustc_bin}" \
            LEG_WEB_FIXTURE_PATH="${bundle_dir}/companions/trials/fake_provider.py" \
            "${python_bin}" \
            companions/leg-web/tests/lifecycle_smoke.py \
              "${bundle_dir}/bin/leg-web" \
              "${bundle_dir}/bin/leg" \
              "${bundle_dir}/bin/leg-ui-supervisor"
          echo "WEB_TRIAL_BUNDLE_DIR=${bundle_dir}" >>"${GITHUB_ENV}"

      - name: Install resource measurement dependencies
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: |
          python3 -m pip install \
            --requirement companions/leg-web/tests/browser-requirements.txt \
            --requirement companions/leg-tui/tests/requirements.txt
          python3 -m playwright install --with-deps chromium

      - name: Build TUI reference and measure trial resources
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: |
          cargo build --locked --release --manifest-path companions/Cargo.toml -p leg-tui
          archive="$(find "${RUNNER_TEMP}/web-trial" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          python3 companions/trials/measure_trial_resources.py \
            --web-archive "${archive}" \
            --web-bin "${WEB_TRIAL_BUNDLE_DIR}/bin/leg-web" \
            --leg-bin "${WEB_TRIAL_BUNDLE_DIR}/bin/leg" \
            --supervisor-bin "${WEB_TRIAL_BUNDLE_DIR}/bin/leg-ui-supervisor" \
            --tui-bin companions/target/release/leg-tui \
            --browser chromium \
            --output "${RUNNER_TEMP}/web-trial/resource-measurements.json"

      - name: Write Web trial report
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: |
          archive="$(find "${RUNNER_TEMP}/web-trial" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          python3 companions/trials/write_web_trial_report.py \
            --template companions/trials/results-template.json \
            --measurements "${RUNNER_TEMP}/web-trial/resource-measurements.json" \
            --bundle-info "${WEB_TRIAL_BUNDLE_DIR}/bundle-info.json" \
            --archive "${archive}" \
            --output-dir "${RUNNER_TEMP}/web-trial" \
            --ci-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload experimental Web trial bundle
        uses: actions/upload-artifact@v6
        with:
          name: leg-web-experimental-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/web-trial/*
          if-no-files-found: error
          retention-days: 14

  tui-trial-artifacts:
    needs: [native, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: macos-latest
            platform: macos-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PTY smoke dependency
        run: |
          python3 -m venv "${RUNNER_TEMP}/leg-tui-trial-venv"
          "${RUNNER_TEMP}/leg-tui-trial-venv/bin/python" -m pip install \
            --requirement companions/leg-tui/tests/requirements.txt
          echo "TUI_TRIAL_PYTHON=${RUNNER_TEMP}/leg-tui-trial-venv/bin/python" >>"${GITHUB_ENV}"

      - name: Test responsiveness harness and comparison fixtures (Linux)
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: |
          "${TUI_TRIAL_PYTHON}" -m unittest discover \
            -s companions/leg-tui/tests \
            -p 'test_*.py'

      - name: Build experimental TUI trial bundle
        run: bash scripts/build-tui-trial.sh --output "${RUNNER_TEMP}/tui-trial"

      - name: Unpack and smoke the experimental TUI trial bundle
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find "${RUNNER_TEMP}/tui-trial" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          [[ -n "${archive}" ]]
          unpack_dir="${RUNNER_TEMP}/tui-trial-unpacked"
          mkdir -p "${unpack_dir}"
          tar -xzf "${archive}" -C "${unpack_dir}"
          bundle_dir="$(find "${unpack_dir}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          [[ -n "${bundle_dir}" ]]
          runtime_path="/usr/bin:/bin:/usr/sbin:/sbin"
          PATH="${runtime_path}" "${TUI_TRIAL_PYTHON}" \
            companions/leg-tui/tests/trial_bundle_smoke.py --bundle-dir "${bundle_dir}"
          PATH="${runtime_path}" "${TUI_TRIAL_PYTHON}" \
            companions/leg-tui/tests/pty_smoke.py \
              --trial-coverage-only \
              --fixture "${bundle_dir}/companions/trials/fake_provider.py" \
              --launcher "${bundle_dir}/start-tui.sh" \
              --tui-bin "${bundle_dir}/bin/leg-tui" \
              --leg-bin "${bundle_dir}/bin/leg" \
              --supervisor-bin "${bundle_dir}/bin/leg-ui-supervisor"
          echo "TUI_TRIAL_BUNDLE_DIR=${bundle_dir}" >>"${GITHUB_ENV}"
          echo "TUI_TRIAL_ARCHIVE=${archive}" >>"${GITHUB_ENV}"

      - name: Measure delivered TUI trial resources
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: |
          "${TUI_TRIAL_PYTHON}" companions/trials/measure_trial_resources.py \
            --tui-only \
            --tui-archive "${TUI_TRIAL_ARCHIVE}" \
            --tui-bin "${TUI_TRIAL_BUNDLE_DIR}/bin/leg-tui" \
            --leg-bin "${TUI_TRIAL_BUNDLE_DIR}/bin/leg" \
            --supervisor-bin "${TUI_TRIAL_BUNDLE_DIR}/bin/leg-ui-supervisor" \
            --output "${RUNNER_TEMP}/tui-trial/resource-measurements.json"

      - name: Run native Linux TUI responsiveness harness
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: |
          "${TUI_TRIAL_PYTHON}" companions/leg-tui/tests/responsiveness_harness.py \
            --tui-bin "${TUI_TRIAL_BUNDLE_DIR}/bin/leg-tui" \
            --leg-bin "${TUI_TRIAL_BUNDLE_DIR}/bin/leg" \
            --supervisor-bin "${TUI_TRIAL_BUNDLE_DIR}/bin/leg-ui-supervisor" \
            --build-profile release \
            --output "${RUNNER_TEMP}/leg-tui-responsiveness-linux.json"

      - name: Upload native Linux responsiveness report
        if: "${{ always() && matrix.platform == 'linux-x86_64' && (github.event_name != 'pull_request' || (!contains(github.event.pull_request.body, 'Closes #183') && !contains(github.event.pull_request.body, 'Part of #183'))) }}"
        uses: actions/upload-artifact@v6
        with:
          name: leg-tui-responsiveness-linux-${{ github.sha }}
          path: ${{ runner.temp }}/leg-tui-responsiveness-linux.json
          if-no-files-found: warn
          retention-days: 14

      - name: Write TUI trial report
        if: ${{ matrix.platform == 'linux-x86_64' }}
        run: |
          python3 companions/trials/write_tui_trial_report.py \
            --template companions/trials/results-template.json \
            --measurements "${RUNNER_TEMP}/tui-trial/resource-measurements.json" \
            --bundle-info "${TUI_TRIAL_BUNDLE_DIR}/bundle-info.json" \
            --archive "${TUI_TRIAL_ARCHIVE}" \
            --output-dir "${RUNNER_TEMP}/tui-trial" \
            --ci-run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Upload experimental TUI trial bundle
        uses: actions/upload-artifact@v6
        with:
          name: leg-tui-experimental-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/tui-trial/*
          if-no-files-found: error
          retention-days: 14

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin' }}
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            companions/leg-web/tests/browser-requirements.txt
            companions/leg-tui/tests/requirements.txt

      - name: Cache Playwright browsers
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-browsers-${{ hashFiles('companions/leg-web/tests/browser-requirements.txt') }}

      - name: Test companion packages (locked)
        if: ${{ matrix.target != 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: cargo test --locked --manifest-path companions/Cargo.toml -p leg-ui-client -p leg-tui -p leg-web

      - name: Test deterministic trial helpers
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: python3 -m unittest companions/trials/test_fake_provider.py companions/trials/test_trial_archive.py companions/trials/test_web_trial_report.py companions/trials/test_tui_trial_report.py

      - name: Test Web host package on Windows (locked)
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: cargo test --locked --manifest-path companions/Cargo.toml -p leg-web

      - name: Build Web host on Windows (locked)
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: cargo build --locked --manifest-path companions/Cargo.toml -p leg-web --bin leg-web

      - uses: actions/setup-python@v5
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        with:
          python-version: "3.12"

      - name: Run native Windows TUI responsiveness harness
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: |
          set -euo pipefail
          runner_temp="$(cygpath -u "${RUNNER_TEMP}")"
          venv="${runner_temp}/leg-tui-responsiveness-venv"
          python -m venv "${venv}"
          "${venv}/Scripts/python.exe" -m pip install \
            --requirement companions/leg-tui/tests/requirements.txt
          cargo build --locked --release --bin leg
          cargo build --locked --manifest-path companions/Cargo.toml --release \
            -p leg-ui-client --bin leg-ui-supervisor
          cargo build --locked --manifest-path companions/Cargo.toml --release -p leg-tui
          "${venv}/Scripts/python.exe" \
            companions/leg-tui/tests/responsiveness_harness.py \
            --tui-bin companions/target/release/leg-tui.exe \
            --leg-bin target/release/leg.exe \
            --supervisor-bin companions/target/release/leg-ui-supervisor.exe \
            --build-profile release \
            --output "${runner_temp}/leg-tui-responsiveness-windows.json"

      - name: Upload native Windows responsiveness report
        if: "${{ always() && matrix.target == 'x86_64-pc-windows-msvc' && (github.event_name != 'pull_request' || (!contains(github.event.pull_request.body, 'Closes #183') && !contains(github.event.pull_request.body, 'Part of #183'))) }}"
        uses: actions/upload-artifact@v6
        with:
          name: leg-tui-responsiveness-windows-${{ github.sha }}
          path: ${{ runner.temp }}/leg-tui-responsiveness-windows.json
          if-no-files-found: warn
          retention-days: 14

      - name: Build Web lifecycle binaries (locked)
        if: ${{ matrix.target != 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: |
          cargo build --locked --bin leg
          cargo build --locked --manifest-path companions/Cargo.toml -p leg-ui-client --bin leg-ui-supervisor
          cargo build --locked --manifest-path companions/Cargo.toml -p leg-web --bin leg-web

      - name: Web host fake-provider lifecycle smoke
        if: ${{ matrix.target != 'x86_64-pc-windows-msvc' }}
        shell: bash
        run: |
          python3 companions/leg-web/tests/lifecycle_smoke.py \
            companions/target/debug/leg-web \
            target/debug/leg \
            companions/target/debug/leg-ui-supervisor

      - name: Install Playwright Chromium and Firefox
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          python3 -m pip install --requirement companions/leg-web/tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium firefox

      - name: Web browser E2E with fake provider (Chromium)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          python3 companions/leg-web/tests/browser_e2e.py \
            --browser chromium \
            companions/target/debug/leg-web \
            target/debug/leg \
            companions/target/debug/leg-ui-supervisor

      - name: Web browser E2E with fake provider (Firefox)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          python3 companions/leg-web/tests/browser_e2e.py \
            --browser firefox \
            companions/target/debug/leg-web \
            target/debug/leg \
            companions/target/debug/leg-ui-supervisor

      - name: TUI native PTY smoke (locked)
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'x86_64-apple-darwin' }}
        shell: bash
        run: |
          python3 -m venv /tmp/leg-pty-test-venv
          /tmp/leg-pty-test-venv/bin/python -m pip install --requirement companions/leg-tui/tests/requirements.txt
          cargo build --locked --bin leg
          cargo build --locked --manifest-path companions/Cargo.toml -p leg-ui-client --bin leg-ui-supervisor
          cargo build --locked --manifest-path companions/Cargo.toml -p leg-tui
          /tmp/leg-pty-test-venv/bin/python companions/leg-tui/tests/pty_smoke.py \
            --tui-bin companions/target/debug/leg-tui \
            --leg-bin target/debug/leg \
            --supervisor-bin companions/target/debug/leg-ui-supervisor \
            --web-bin companions/target/debug/leg-web

      - name: Build (locked)
        shell: bash
        run: cargo build --locked --verbose --target "${TARGET}"

      - name: Test (locked)
        shell: bash
        run: cargo test --locked --verbose --target "${TARGET}"

      - name: Test release helpers
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: bash tests/release_test.sh

      - name: Verify default core dependency and package boundaries
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p leg --edges normal,build --prefix none --format '{p}' \
            >"${RUNNER_TEMP}/leg-core-dependencies.txt"
          if rg -n '^(axum|crossterm|leg-tui|leg-web|leg-ui-client|ratatui|signal-hook|tokio|tower|unicode-segmentation|unicode-width) v' "${RUNNER_TEMP}/leg-core-dependencies.txt"; then
            echo '::error::default leg dependencies include companion UI/server packages'
            exit 1
          fi
          cargo package --locked --list --allow-dirty \
            >"${RUNNER_TEMP}/leg-core-package-files.txt"
          if rg -n '^(companions/|src/bin/leg-web(\.rs)?$|src/bin/leg-ui-supervisor(\.rs)?$)' \
            "${RUNNER_TEMP}/leg-core-package-files.txt"; then
            echo '::error::core Cargo package includes companion UI contents'
            exit 1
          fi

      - name: Verify binary version
        shell: bash
        run: |
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[0].version')"
          binary="target/${TARGET}/debug/leg"
          if [[ "${TARGET}" == *-windows-* ]]; then
            binary="${binary}.exe"
          fi
          test "$("./${binary}" --version)" = "leg ${version}"

  cross:
    runs-on: ubuntu-latest
    env:
      TARGET: armv7-unknown-linux-musleabihf
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: armv7-unknown-linux-musleabihf

      - uses: Swatinem/rust-cache@v2

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cross-build (locked)
        run: cross build --locked --verbose --target "${TARGET}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test development install script
        run: python3 scripts/tests/test_dev_script.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check companion formatting
        run: cargo fmt --manifest-path companions/Cargo.toml --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Web host Clippy
        run: cargo clippy --locked --manifest-path companions/Cargo.toml -p leg-web --all-targets -- -D warnings

  tui-responsiveness-comparison:
    if: "${{ always() && github.event_name == 'pull_request' && (contains(github.event.pull_request.body, 'Closes #183') || contains(github.event.pull_request.body, 'Part of #183')) }}"
    needs: [native, lint]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            host: linux
          - runner: windows-latest
            host: windows
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.89.0

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install native responsiveness test requirements
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.host }}" == windows ]]; then
            runner_temp="$(cygpath -u "${RUNNER_TEMP}")"
            venv="${runner_temp}/leg-tui-183-venv"
            python -m venv "${venv}"
            responsiveness_python="${venv}/Scripts/python.exe"
          else
            venv="${RUNNER_TEMP}/leg-tui-183-venv"
            python3 -m venv "${venv}"
            responsiveness_python="${venv}/bin/python"
          fi
          echo "TUI_RESPONSIVENESS_PYTHON=${responsiveness_python}" >>"${GITHUB_ENV}"
          "${responsiveness_python}" -m pip install \
            --requirement companions/leg-tui/tests/requirements.txt

      - name: Build final TUI responsiveness binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --bin leg
          cargo build --locked --manifest-path companions/Cargo.toml --release \
            -p leg-ui-client --bin leg-ui-supervisor
          cargo build --locked --manifest-path companions/Cargo.toml --release -p leg-tui

      - name: Compare baseline and final responsiveness on native host
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.host }}" == windows ]]; then
            runner_temp="$(cygpath -u "${RUNNER_TEMP}")"
            suffix=".exe"
          else
            runner_temp="${RUNNER_TEMP}"
            suffix=""
          fi
          output_dir="${runner_temp}/leg-tui-183"
          "${TUI_RESPONSIVENESS_PYTHON}" companions/leg-tui/tests/compare_responsiveness.py \
            --host "${{ matrix.host }}" \
            --baseline-revision b5444f9f409a6edbab7cd02ed776a7df36e6e412 \
            --final-revision "${GITHUB_SHA}" \
            --tui-bin "companions/target/release/leg-tui${suffix}" \
            --leg-bin "target/release/leg${suffix}" \
            --supervisor-bin "companions/target/release/leg-ui-supervisor${suffix}" \
            --output-dir "${output_dir}"

      - name: Upload native responsiveness comparison and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: leg-tui-responsiveness-comparison-${{ matrix.host }}-${{ github.sha }}
          path: ${{ runner.temp }}/leg-tui-183/*
          if-no-files-found: warn
          retention-days: 14
