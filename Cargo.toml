[package]
name = "leg"
version = "0.1.3"
edition = "2024"
rust-version = "1.89"
description = "leg"
readme = "README.md"
license-file = "LICENSE"

[[bin]]
name = "leg"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
similar = "2.7"
ureq = "3.3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
strip = true
