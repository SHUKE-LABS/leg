[package]
name = "leg"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "leg"
readme = "README.md"
license-file = "LICENSE"

[[bin]]
name = "leg"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
ureq = "3.3.0"

[profile.release]
strip = true
